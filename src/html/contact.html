<html lang="en">
<head>
  <meta charset="UTF-8">

<body>
  <header>
    <div class="nav-wrap">
      <div class="brand">Coding Assistants</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="clients.html">Clients</a>`r`n        <a href="your-lucky-number.html">Your Lucky Number</a>`r`n        <a href="contact.html">Contact</a>
      </nav>

  </header>

  <main>
    <section class="card">
      <h1>Contact Us</h1>
      <p>Tell us what you are building and where you need technical support.</p>
    </section>

    <form id="contact-form">
      <label for="name">Name
        <input type="text" id="name" name="name" required>
      </label>

      <label for="email">Email
        <input type="email" id="email" name="email" required>
      </label>

      <label for="message">Message
        <textarea id="message" name="message" rows="5" required></textarea>
      </label>

      <button type="submit">Send Message</button>
      <div id="form-message" aria-live="polite"></div>
    </form>
  </main>

  <footer>
    &copy; <span id="year"></span> Coding Assistants. All rights reserved.
  </footer>
</body>
