name: Auto PR on Feature Push

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if one does not exist
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base
            });

            if (existing.data.length > 0) {
              core.info(`Open PR already exists: #${existing.data[0].number}`);
              return;
            }

            const commitMessage = (context.payload.head_commit?.message || '').split('\n')[0].trim();
            const defaultTitle = `feat: merge ${head} into ${base}`;
            const title = commitMessage || defaultTitle;
            const body = [
              'This pull request was created automatically after pushing a feature branch.',
              '',
              `- Source branch: \`${head}\``,
              `- Target branch: \`${base}\``,
              '',
              'Manual approval is required before merge.'
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body
            });

            core.info(`Created PR #${pr.data.number}: ${pr.data.html_url}`);
